name: Verify pilot evaluator
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  evaluator:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13']
        include:
          - os: ubuntu-latest
            python-version: '3.10'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verification dependencies
        run: python -m pip install -r evaluator/requirements.txt -r evidence/development-2026-11-10/requirements.txt
      - name: Run evaluator contract tests
        working-directory: evaluator
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Generate synthetic demonstration
        working-directory: evaluator
        run: python demo.py "$RUNNER_TEMP/blueprintbench-demo"
      - name: Verify generated public artifacts
        run: python tools/build_public.py --check
      - name: Replay historical structural counts offline
        run: python evidence/development-2026-11-10/replay.py
      - name: Verify wiki navigation and README links
        run: python tools/check_wiki.py
      - name: Verify internal baseline analysis and replay
        run: |
          python -m unittest discover -s internal_tests/2026-11-11-frontier -p 'test_*.py'
          python tools/build_internal_tests.py --check
          python internal_tests/2026-11-11-frontier/replay_translation.py "$RUNNER_TEMP/internal-baseline-replay"
      - name: Verify leaderboard data and structured-data contract
        run: |
          python tools/build_leaderboard.py --check
          python -m unittest discover -s tools -p 'test_leaderboard_schema.py'
          python tools/build_adversarial.py --check
          python -m unittest discover -s tools -p 'test_adversarial.py'
      - name: Verify internal calibration and model roster
        run: |
          python tools/calibration.py --check
          python tools/build_calibration.py --check
          python tools/build_roster.py --check
          python -m unittest discover -s tools -p 'test_calibration.py'
          python -m unittest discover -s tools -p 'test_roster.py'
      - name: Verify next-cycle development cases and adjudication boundaries
        run: python -m unittest discover -s tools -p 'test_next_cycle.py'
      - name: Verify release and vulnerable-version notice
        run: python -m unittest discover -s tools -p 'test_release_contract.py'
      - name: Verify six-scenario feasibility records
        run: |
          python -m unittest discover -s tools -p 'test_next_cycle_execution.py'
          python -m unittest discover -s internal_tests/2026-11-11-next-cycle -p 'test_runner.py'
          python tools/build_next_cycle.py --check
      - name: Verify frozen next-cycle receipts and final publication evidence
        run: python -m unittest discover -s tools -p 'test_next_cycle_evidence.py'

      - name: Verify shared schema and qualification boundaries
        run: python -m unittest discover -s tools -p 'test_schema_alignment.py'

      - name: Verify research site architecture
        run: |
          python tools/build_site_architecture.py --check
          python -m unittest discover -s tools -p 'test_site_architecture.py'

      - name: Verify real-document generation publication
        run: |
          python tools/build_generation.py --check
          python -m unittest discover -s tools -p 'test_generation_publication.py'
      - name: Verify real-document frozen contracts and offline corrected replay
        run: |
          python -m unittest discover -s internal_tests/2026-11-11-real-procurement -p 'test_contracts.py'
          python -m unittest discover -s internal_tests/2026-11-11-real-procurement/corrections -p 'test_quote_normalisation_v11.py'
          python -m unittest discover -s internal_tests/2026-11-11-real-procurement -p 'test_replay.py'
      - name: Verify real-document replay on Linux and macOS
        if: runner.os != 'Windows'
        run: python internal_tests/2026-11-11-real-procurement/replay.py --check

      - name: Verify workflow connectivity diagnostics
        run: |
          python -m unittest discover -s tools/workflow_connectivity -p 'test*.py'
          python tools/workflow_connectivity/check.py --check

      - name: Verify assigned study calls
        run: python tools/study_accountability.py --check

      - name: Verify measurement diagnostics and paired bootstrap
        run: |
          python tools/build_measurement_diagnostics.py --check
          python -m unittest discover -s tools -p 'test_measurement_diagnostics.py'
          python -m unittest discover -s tools -p 'test_paired_cluster_bootstrap.py'
          python -m unittest discover -s tools -p 'test_qualification_consistency.py'

      - name: Test local validation agent without model calls
        run: python -m unittest discover -s validation_agent -p 'test*.py'

      - name: Verify local advisory agent diagnostics
        run: |
          python tools/build_local_agent_diagnostics.py --check
          python -m unittest discover -s tools -p 'test_local_agent_diagnostics.py'
