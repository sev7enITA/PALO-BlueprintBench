name: Verify pilot evaluator
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  evaluator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run evaluator contract tests
        working-directory: evaluator
        run: python -m unittest -v test_blueprintbench
      - name: Generate synthetic demonstration
        working-directory: evaluator
        run: python demo.py "$RUNNER_TEMP/blueprintbench-demo"
